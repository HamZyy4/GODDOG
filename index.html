<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GODDOG - Reward Leaderboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #050505; /* Solid dark background */
            color: #f8fafc; 
        }

        /* Hilangkan scrollbar bawaan untuk area riwayat ronde (mobile friendly) */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animasi muncul (Fade Up) */
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-card {
            animation: fadeUp 0.5s ease-out forwards;
            opacity: 0;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden selection:bg-cyan-500 selection:text-white pb-10">

    <!-- HEADER / BANNER -->
    <header class="relative w-full h-[220px] flex flex-col items-center justify-center">
        <!-- Banner Image -->
        <div class="absolute inset-0 z-0">
            <img src="https://www.image2url.com/r2/default/images/1786552840470-924cd946-d86c-4dee-8a31-954207d27876.png" 
                 alt="Banner GLW GODDOG" 
                 class="w-full h-full object-cover object-top opacity-50 mix-blend-screen">
            <div class="absolute inset-0 bg-gradient-to-b from-[#050505]/40 via-[#050505]/80 to-[#050505]"></div>
        </div>
        
        <!-- Header Text (Sesuai Referensi) -->
        <div class="relative z-10 text-center mt-6">
            <h1 class="text-4xl md:text-5xl font-black text-white tracking-widest drop-shadow-lg">
                GODDOG
            </h1>
            <p class="text-slate-300 text-xs md:text-sm font-semibold tracking-[0.3em] mt-1 mb-3">
                REWARD LEADERBOARD
            </p>
            <div class="inline-flex items-center gap-2 bg-red-500/20 px-3 py-1 rounded-full border border-red-500/30">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                <span class="text-[10px] text-red-100 font-bold tracking-widest">LIVE</span>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="relative z-20 max-w-[600px] mx-auto px-4 sm:px-6">
        
        <!-- Divider & Info Leaderboard -->
        <div class="border-b-2 border-slate-800 pb-3 mb-5 flex justify-between items-end">
            <h2 class="text-lg font-bold tracking-widest text-slate-200">LEADERBOARD</h2>
            <span id="player-count" class="text-xs font-bold text-slate-500 tracking-wider">MEMUAT...</span>
        </div>

        <!-- List Data Container -->
        <div id="player-list" class="flex flex-col gap-4">
            
            <!-- Loading Indicator -->
            <div class="py-10 text-center" id="loading-state">
                <div class="w-8 h-8 border-4 border-slate-700 border-t-slate-300 rounded-full animate-spin mx-auto mb-3"></div>
                <p class="text-slate-400 text-xs font-medium animate-pulse tracking-widest">SINKRONISASI DATA...</p>
            </div>

        </div>

    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Formatter Uang Rupiah (Rp)
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(number);
        };

        // Formatter Angka (Contoh: 1250 -> 1.250)
        const formatNumber = (number) => {
            return new Intl.NumberFormat('id-ID').format(number);
        };

        // Mengambil data dari data.json (menggunakan parameter tanggal agar tidak ter-cache di GitHub)
        fetch('data.json?v=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error("Gagal memuat data");
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('player-list');
                const countText = document.getElementById('player-count');
                
                // Menghitung total poin setiap player dan memasukkannya ke dalam objek baru
                let players = data.map(player => {
                    const totalPoints = player.rounds.reduce((acc, curr) => acc + curr, 0);
                    const totalReward = Math.floor(totalPoints / 100) * 5000;
                    return { ...player, totalPoints, totalReward };
                });

                // SORTING: Mengurutkan player berdasarkan poin tertinggi ke terendah
                players.sort((a, b) => b.totalPoints - a.totalPoints);

                // Update jumlah player
                countText.innerText = `${players.length} PLAYERS`;
                
                // Kosongkan container dari loading icon
                container.innerHTML = ''; 

                // Render HTML per Player
                players.forEach((player, index) => {
                    // Logika Medali untuk Top 3
                    let medal = '';
                    if (index === 0) medal = '🥇';
                    else if (index === 1) medal = '🥈';
                    else if (index === 2) medal = '🥉';

                    // Format nomor urut (01, 02, dst)
                    const rankNum = String(index + 1).padStart(2, '0');

                    // UI Kotak Ronde (R1, R2, dst)
                    const roundsHtml = player.rounds.map((pts, i) => `
                        <div class="flex flex-col items-center flex-shrink-0 w-12">
                            <span class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[10px] font-bold tracking-wider mb-1">[R${i + 1}]</span>
                            <span class="text-sm font-bold text-slate-100">${pts}</span>
                        </div>
                    `).join('');

                    // Buat Elemen Card
                    const card = document.createElement('div');
                    card.className = `bg-[#0a0a0a] border border-slate-800 rounded-xl p-4 shadow-xl animate-card`;
                    card.style.animationDelay = `${index * 80}ms`;

                    // Struktur Layout Flexbox Presisi
                    card.innerHTML = `
                        <!-- BARIS 1: Rank & Total Point -->
                        <div class="flex justify-between items-end mb-1">
                            <div class="text-lg font-bold text-white tracking-wide">
                                ${medal} <span class="text-slate-400">#${rankNum}</span>
                            </div>
                            <div class="text-2xl font-black text-white tracking-tight leading-none">
                                ${formatNumber(player.totalPoints)}
                            </div>
                        </div>

                        <!-- BARIS 2: Username & Label PT -->
                        <div class="flex justify-between items-start mb-5">
                            <div class="text-sm font-medium text-slate-400 ml-1 truncate max-w-[70%]">
                                ${player.username}
                            </div>
                            <div class="text-[10px] font-bold text-emerald-500 tracking-widest mt-0.5">
                                PT
                            </div>
                        </div>

                        <!-- SECTION: Rounds -->
                        <div class="mb-4">
                            <p class="text-[10px] font-bold text-slate-500 tracking-widest mb-2">ROUNDS</p>
                            <!-- Horizontal Scroll List -->
                            <div class="flex gap-2 overflow-x-auto hide-scroll snap-x pb-2">
                                ${roundsHtml}
                                <!-- Tambahan Panah jika data panjang -->
                                ${player.rounds.length > 5 ? `<div class="flex items-center text-slate-600 text-sm ml-2">→</div>` : ''}
                            </div>
                        </div>

                        <!-- GARIS PEMISAH -->
                        <hr class="border-slate-800 mb-3">

                        <!-- SECTION: Reward -->
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold tracking-widest text-slate-400">REWARD</span>
                            <div class="flex items-center gap-3">
                                <span class="font-black text-amber-400 text-lg tracking-wide">${formatRupiah(player.totalReward)}</span>
                                <img src="https://www.image2url.com/r2/default/images/1786552576749-6570b46a-b8a5-4cfe-859c-b36e5f687885.jpg" 
                                     alt="Logo" 
                                     class="w-6 h-6 rounded-full object-cover border border-amber-500/50">
                            </div>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
            })
            .catch(error => {
                document.getElementById('player-list').innerHTML = `
                    <div class="bg-red-950/20 border border-red-900/50 text-red-400 p-4 rounded-xl text-center">
                        <p class="text-sm font-bold tracking-wider mb-1">GAGAL MENGAMBIL DATA</p>
                        <p class="text-[10px] opacity-70">Sistem tidak dapat mendeteksi file data.json</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
