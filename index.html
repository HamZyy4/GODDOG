<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Breach Notice // Security By Kaii</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --card-bg: rgba(15, 15, 20, 0.7);
            --border-color: rgba(239, 68, 68, 0.2);
            --accent-red: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background grid pattern */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
        }

        /* Header / Badge */
        .badge-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
            animation: pulse 2s infinite;
        }

        .brand-identifier {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* Main Content */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p.description {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.75rem;
        }

        /* Terminal Console Box */
        .console {
            background: #050507;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #e5e7eb;
            margin-bottom: 2rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .console-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 0.85rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }

        .console-body {
            line-height: 1.5;
        }

        .prompt {
            color: var(--accent-red);
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 14px;
            background-color: var(--text-main);
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        /* Footer Signature */
        .footer-signature {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 1rem;
        }

        .signature-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .signature-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @media (max-width: 480px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Badge -->
        <div class="badge-wrapper">
            <div class="status-badge">
                <span class="status-dot"></span>
                Security Incident
            </div>
            <div class="brand-identifier">REF // 0x4F54</div>
        </div>

        <!-- Main Title & Desc -->
        <h1>Perimeter Compromised.</h1>
        <p class="description">
            Infrastruktur Anda telah diuji dan terbukti memiliki celah keamanan. Perbaiki kerentanan sistem sebelum dieksploitasi pihak lain.
        </p>

        <!-- Minimalist Terminal Box -->
        <div class="console">
            <div class="console-header">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="console-body">
                <span class="prompt">&gt;</span> <span id="typed-text"></span><span class="cursor"></span>
            </div>
        </div>

        <!-- Signature -->
        <div class="footer-signature">
            <span class="signature-title">Audited & Secured By</span>
            <span class="signature-name">Kaii &bull; Forkt Community</span>
        </div>
    </div>

    <script>
        const textToType = "INITIALIZING AUDIT: Access vectors analyzed. System hardening required immediately.";
        let i = 0;
        const speed = 35; // Kecepatan mengetik dalam milidetik

        function typeWriter() {
            if (i < textToType.length) {
                document.getElementById("typed-text").innerHTML += textToType.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }

        window.onload = function() {
            setTimeout(typeWriter, 400);
        };
    </script>
</body>
</html>
